plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

group = 'com.chillypeppers.log-handler'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}

tasks.register('benchmark', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.chillypeppers.loghandler.BenchmarkRunner'
    maxHeapSize = '2g'
    args providers.gradleProperty('input').getOrElse('access_large.log'),
        providers.gradleProperty('output').getOrElse('experiments/results')
}
