plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

group = 'com.chillypeppers.log-handler'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    jvmToolchain(25)
}

test {
    // The full-file integration test retains maps for many distinct IPs across 1.5 million records.
    maxHeapSize = '2g'
    useJUnitPlatform()
}
